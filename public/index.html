<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markdown Manager</title>
  <link rel="stylesheet" id="md-css-light" href="/vendor/github-markdown-css/github-markdown-light.css">
  <link rel="stylesheet" id="md-css-dark" href="/vendor/github-markdown-css/github-markdown-dark.css">
  <link rel="stylesheet" href="/vendor/toastui/toastui-editor.css">
  <link rel="stylesheet" href="/vendor/toastui/theme/toastui-editor-dark.css">
  <link rel="stylesheet" href="/vendor/code-syntax-highlight/toastui-editor-plugin-code-syntax-highlight.css">
  <link rel="stylesheet" href="/vendor/diff2html/css/diff2html.min.css">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/code-theme.css">
  <script>
    // Téma beállítása még a megjelenítés előtt (ne villanjon fel a világos téma)
    (function () {
      var pref = localStorage.getItem('theme') || 'auto';
      var dark = pref === 'dark' || (pref === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      document.getElementById('md-css-light').disabled = dark;
      document.getElementById('md-css-dark').disabled = !dark;
    })();
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">📘 Markdown Manager</div>
    <div class="search">
      <label class="sfield" title="Search by file name / path ( / )">
        <span>📄</span><input id="search-name" type="search" placeholder="File name…  ( / )" autocomplete="off" spellcheck="false">
      </label>
      <label class="sfield" title="Search in file contents. Every word must occur; text in quotes (&quot;…&quot;) is an exact phrase.">
        <span>🔍</span><input id="search-content" type="search" placeholder='Content…  ("exact phrase")' autocomplete="off">
      </label>
    </div>
    <button id="new-file" class="btn" title="Create a new markdown file">＋ New file</button>
    <button id="manage-repos" class="btn" title="Add, edit, remove repositories">⚙ Repos</button>
    <button id="theme-toggle" class="btn" title="Theme: auto"></button>
    <div class="sync-wrap">
      <button id="sync" class="btn primary" title="Download / update repositories">⟳ Sync ▾</button>
      <div id="sync-menu" class="repo-menu sync-menu" hidden></div>
    </div>
  </header>
  <div id="status" class="statusbar">Loading…</div>

  <main class="content">
    <div class="toolbar">
      <button id="filter-changed" class="btn toggle" title="Only modified and new files (with an edit branch)">
        ✎ Modified / new <span id="filter-count" class="count">0</span>
      </button>
      <div class="repo-filter-wrap">
        <button id="repo-filter" class="btn toggle" title="Only files of the selected repositories (tree, search, modified list)" hidden>
          📦 Repo: <span id="repo-filter-label">all</span> ▾
        </button>
        <div id="repo-menu" class="repo-menu" hidden>
          <div id="repo-menu-list"></div>
          <div class="repo-menu-foot"><button id="repo-menu-all" class="btn sm">All</button></div>
        </div>
      </div>
      <button id="clear-filters" class="btn" title="Clear search fields and filters" hidden>✕ Clear filters</button>
      <span class="toolbar-spacer"></span>
      <button id="expand-all" class="btn sm" title="Expand all folders">⊞ Expand all</button>
      <button id="collapse-all" class="btn sm" title="Collapse all folders">⊟ Collapse all</button>
    </div>
    <section id="results" class="results" hidden></section>
    <section id="changed" class="results" hidden></section>
    <section id="tree" class="tree"></section>
    <div id="empty" class="empty" hidden></div>
  </main>

  <template id="layer-tpl">
    <div class="layer">
      <div class="layer-backdrop"></div>
      <div class="layer-panel">
        <header class="layer-header">
          <div class="layer-title">
            <div class="title"></div>
            <div class="path"></div>
          </div>
          <label class="new-path" hidden>
            <select class="new-path-repo" title="Repository"></select>
            <span class="new-path-prefix"></span>
            <input class="new-path-input" placeholder="folder/file-name.md" autocomplete="off" spellcheck="false">
            <datalist class="new-path-dirs"></datalist>
          </label>
          <div class="layer-actions">
            <div class="hit-nav" hidden title="Search term (F3 / Shift+F3)">
              <span class="hit-term"></span>
              <span class="hit-count"></span>
              <button class="hit-prev" title="Previous (Shift+F3)">‹</button>
              <button class="hit-next" title="Next (F3)">›</button>
              <button class="hit-clear" title="Clear highlight">✕</button>
            </div>
            <span class="badge new new-badge" hidden title="This file exists only on its edit branch so far">new file</span>
            <div class="seg source-toggle" hidden>
              <button data-src="branch" title="Content of the edit branch">✎ Modified</button>
              <button data-src="base" class="base-label">main</button>
              <button data-src="diff" title="Changes compared to the base branch">± Diff</button>
            </div>
            <a class="btn pr" target="_blank" rel="noopener" hidden>↗ Pull request</a>
            <button class="btn danger discard" title="Delete the edit branch from the server (reverts the changes / the deletion)" hidden>↺ Discard</button>
            <button class="btn danger delete" title="Delete file: a deleting commit on the file's own branch (removed after the PR is merged)" hidden>🗑 Delete</button>
            <select class="history" title="Earlier versions" hidden></select>
            <button class="btn width" title="Reading width: full / narrow">↔ Width</button>
            <button class="btn edit">✎ Edit</button>
            <input class="commit-msg" placeholder="Commit message (optional)" hidden>
            <button class="btn layout" title="Side-by-side / tabs" hidden>◫ Layout</button>
            <button class="btn primary save" hidden>💾 Save</button>
            <button class="btn cancel" hidden>Cancel</button>
            <button class="btn close" title="Close (Esc)">✕</button>
          </div>
        </header>
        <div class="layer-body">
          <div class="view">
            <div class="del-banner" hidden>
              🗑 This file is <b>marked for deletion</b> on the <code class="del-branch"></code> branch.
              It will be deleted when the pull request is merged. To undo: <b>↺ Discard</b>.
            </div>
            <div class="rev-banner" hidden>
              <span class="rev-info"></span>
              <button class="btn sm rev-diff" title="Markdown source differences compared to the current version">± Diff to current</button>
              <button class="btn sm rev-back">↩ Back to the current version</button>
            </div>
            <article class="markdown-body"></article>
          </div>
          <div class="editor" hidden></div>
          <div class="diff-view" hidden>
            <div class="diff-head">
              <button class="btn sm diff-back" hidden>↩ Back to the version</button>
              <div class="diff-info"></div>
              <div class="seg diff-format">
                <button data-fmt="side-by-side">◫ Side by side</button>
                <button data-fmt="line-by-line">☰ Unified</button>
              </div>
            </div>
            <div class="diff-commits"></div>
            <div class="diff-body"></div>
          </div>
        </div>
      </div>
    </div>
  </template>

  <div id="sync-dialog" class="sync-dialog" hidden>
    <div class="sync-backdrop"></div>
    <div class="sync-box">
      <header>
        <b>⟳ Synchronization</b>
        <span class="sync-state"></span>
        <button class="btn sync-close" title="Close (sync continues in the background)">✕</button>
      </header>
      <div class="progress"><div class="bar"></div></div>
      <div class="sync-current"></div>
      <pre class="sync-log"></pre>
    </div>
  </div>

  <div id="repo-dialog" class="sync-dialog repo-dialog" hidden>
    <div class="sync-backdrop"></div>
    <div class="sync-box">
      <header>
        <b>⚙ Repositories</b>
        <span class="muted repo-server"></span>
        <button class="btn repo-close" title="Close (Esc)">✕</button>
      </header>
      <div class="repo-body">
        <table class="repo-table">
          <thead><tr><th>ID</th><th>Repository</th><th>Branch</th><th>Folder</th><th>Images</th><th>Status</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
        <form class="repo-form" autocomplete="off">
          <h4 class="repo-form-title">Add a repository</h4>
          <div class="repo-grid">
            <label>Repository path on the server
              <span class="repo-url"><span class="repo-url-prefix"></span><input name="path" placeholder="group/repo.git" spellcheck="false" required></span>
            </label>
            <label>ID (top level of the tree)<input name="id" placeholder="automatic" spellcheck="false" pattern="[a-z0-9][a-z0-9_\-]{0,39}"></label>
            <label>Base branch<input name="branch" spellcheck="false"></label>
            <label>Folder in the repository (empty = root)<input name="docsPath" placeholder="docs" spellcheck="false"></label>
            <label>Image folder<input name="assetsPath" placeholder="&lt;folder&gt;/assets" spellcheck="false"></label>
          </div>
          <div class="repo-form-actions">
            <button type="submit" class="btn primary repo-submit">＋ Add and download</button>
            <button type="button" class="btn repo-cancel" hidden>Cancel</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div id="toasts" class="toasts"></div>

  <script src="/vendor-built/toastui-editor-all.min.js"></script>
  <script src="/mdtable.js"></script>
  <script src="/app.js"></script>
</body>
</html>
