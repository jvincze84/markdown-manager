<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#24292f">
  <title>Markdown Manager – offline</title>
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
           background: #f6f8fa; color: #1f2328; text-align: center; }
    @media (prefers-color-scheme: dark) { body { background: #010409; color: #e6edf3; } }
    img { width: 96px; height: 96px; }
    h1 { font-size: 20px; margin: 16px 0 4px; }
    p { margin: 0 0 20px; opacity: .75; }
    button { font: inherit; padding: 6px 16px; border-radius: 6px; border: 1px solid #1f883d; background: #1f883d; color: #fff; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon.svg" alt="">
    <h1>You are offline</h1>
    <p>Markdown Manager needs a connection to the server.<br>The page reloads automatically when the connection is back.</p>
    <button id="retry" type="button">⟳ Retry</button>
  </main>
  <script>
    document.getElementById('retry').addEventListener('click', () => location.reload());
    addEventListener('online', () => location.reload());
  </script>
</body>
</html>
